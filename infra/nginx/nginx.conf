# Nginx hace tres trabajos:
#   1. Sirve el frontend compilado (archivos estáticos).
#   2. Balancea las peticiones /api entre varias instancias de la API.
#   3. Aplica límites y cabeceras de seguridad delante de todo.

# Balanceo: cada petición va a la instancia con menos conexiones abiertas (least_conn).
# Si una instancia falla 3 veces seguidas, se aparta 10 s y el tráfico sigue por las demás.
upstream simplify_api {
    least_conn;
    server api1:4000 max_fails=3 fail_timeout=10s;
    server api2:4000 max_fails=3 fail_timeout=10s;
    # Conexiones reutilizables con la API: evita abrir una conexión TCP nueva por petición.
    keepalive 32;
}

# Límite de peticiones por IP para las rutas de cuenta (registro, login, renovación):
# frena ataques de fuerza bruta antes de que lleguen a la API.
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

# Registro de accesos que incluye qué instancia atendió cada petición y cuánto tardó.
log_format balanced '$remote_addr "$request" $status ${request_time}s '
                    'upstream=$upstream_addr upstream_time=${upstream_response_time}s '
                    'id=$request_id';

server {
    listen 80;
    server_name _;
    server_tokens off;            # no revela la versión de Nginx
    client_max_body_size 1m;      # la API acepta como máximo 100 KB; 1 MB deja margen

    access_log /var/log/nginx/access.log balanced;

    root /usr/share/nginx/html;

    # Compresión de texto: respuestas más livianas.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ---------- API ----------
    location /api/ {
        proxy_pass http://simplify_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # El mismo id aparece en el log de Nginx y en el de la API: permite seguir una petición.
        proxy_set_header X-Request-Id $request_id;

        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        # Si una instancia no responde, la petición se reintenta en otra (solo si es segura de repetir).
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
    }

    location /api/v1/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://simplify_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
    }

    # ---------- Frontend ----------
    # Archivos con hash en el nombre: nunca cambian, se cachean un año.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Cualquier otra ruta es de la app (React Router): se responde con index.html,
    # que no se cachea para que cada despliegue llegue de inmediato.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

    # Para el healthcheck de Docker; no deja rastro en el log.
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
