openapi: 3.1.0
info:
  title: Simplify API
  version: 0.1.0
  description: |
    API REST de Simplify.

    - Autenticación: cookies httpOnly (ver docs/adr/0002). Las rutas protegidas
      responden 401 sin sesión válida.
    - CSRF: todo POST, PATCH y DELETE debe enviar la cabecera `X-CSRF-Token` con el valor
      de la cookie `simplify_csrf` (se obtiene con GET /auth/csrf); si falta, responde 403.
    - Importes: siempre texto con hasta 2 decimales, por ejemplo "85.50" (docs/adr/0003).
    - Fechas: texto AAAA-MM-DD.
    - Aislamiento: un usuario solo ve sus propios datos; un id ajeno responde 404.
servers:
  - url: /api/v1
security:
  - cookieAuth: []
tags:
  - name: health
  - name: auth
  - name: profile
  - name: categories
  - name: movements
  - name: summary

paths:
  /health/live:
    get:
      security: []
      tags: [health]
      summary: El proceso está vivo
      responses:
        '200':
          description: OK
  /health/ready:
    get:
      security: []
      tags: [health]
      summary: La instancia puede atender tráfico (la usa el balanceador)
      responses:
        '200':
          description: Base de datos disponible
        '503':
          description: Base de datos no disponible; el balanceador saca la instancia

  /auth/register:
    post:
      security: []
      tags: [auth]
      summary: Crear cuenta (RF-01)
      description: |
        Crea la cuenta con la contraseña cifrada con Argon2id y las 11 categorías
        predeterminadas, en una sola transacción, e inicia la sesión (cookies).
        El correo se guarda en minúsculas. Los campos extra del cuerpo (por ejemplo
        `id` o `currency`) se ignoran.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterInput' }
      responses:
        '201':
          description: Cuenta creada
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/CsrfError' }
        '409': { $ref: '#/components/responses/Conflict' }
  /auth/csrf:
    get:
      security: []
      tags: [auth]
      summary: Obtener el token CSRF
      description: |
        Guarda el token en la cookie `simplify_csrf` (legible por JavaScript) y lo devuelve.
        El frontend debe enviarlo en la cabecera `X-CSRF-Token` en todo POST, PATCH y DELETE.
        Si el navegador ya tiene un token válido, se conserva.
      responses:
        '200':
          description: Token CSRF
          content:
            application/json:
              schema:
                type: object
                properties:
                  csrfToken: { type: string }
  /auth/login:
    post:
      security: []
      tags: [auth]
      summary: Iniciar sesión (RF-02)
      description: |
        Responde igual si el correo no existe o si la contraseña es incorrecta.
        Tras 5 fallos en 15 minutos para un correo (o 20 desde una IP) responde 429
        con la cabecera `Retry-After`, aunque la contraseña sea correcta.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginInput' }
      responses:
        '200':
          description: Sesión iniciada; se envían las cookies `simplify_at` y `simplify_rt`
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/CsrfError' }
        '429':
          description: Demasiados intentos
          headers:
            Retry-After:
              description: Segundos que faltan para poder reintentar
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /auth/refresh:
    post:
      security: []
      tags: [auth]
      summary: Renovar la sesión
      description: |
        Usa la cookie `simplify_rt` y la rota: el token anterior deja de servir.
        Si llega un token ya usado (posible robo), se cierran todas las sesiones del usuario.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204': { description: Cookies renovadas }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/CsrfError' }
  /auth/logout:
    post:
      security: []
      tags: [auth]
      summary: Cerrar sesión (RF-03)
      description: Revoca el token de renovación y borra las cookies. Responde 204 aunque no haya sesión.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204': { description: Sesión cerrada }
        '403': { $ref: '#/components/responses/CsrfError' }

  /me:
    get:
      tags: [profile]
      summary: Perfil del usuario (RF-04)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Error' }
    patch:
      tags: [profile]
      summary: Cambiar nombre o moneda (RF-04, RF-18)
      description: |
        Solo acepta `name` y `currency`; cualquier otro campo se ignora.
        Cambiar la moneda no convierte los importes ya registrados.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProfileInput' }
      responses:
        '200':
          description: Perfil actualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/CsrfError' }

  /categories:
    get:
      tags: [categories]
      summary: Listar categorías (RF-10)
      description: Incluye cuántos movimientos usa cada una. Orden por tipo y nombre.
      parameters:
        - { name: type, in: query, schema: { $ref: '#/components/schemas/MovementType' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  categories:
                    type: array
                    items: { $ref: '#/components/schemas/Category' }
        '401': { $ref: '#/components/responses/Error' }
    post:
      tags: [categories]
      summary: Crear categoría (RF-10)
      description: El nombre no se puede repetir dentro del mismo tipo (sin distinguir mayúsculas).
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryInput' }
      responses:
        '201':
          description: Creada
          content:
            application/json:
              schema:
                type: object
                properties:
                  category: { $ref: '#/components/schemas/Category' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/Conflict' }
  /categories/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [categories]
      summary: Renombrar categoría
      description: Solo se cambia el nombre; el tipo es fijo.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 2, maxLength: 40 }
      responses:
        '200':
          description: Actualizada
          content:
            application/json:
              schema:
                type: object
                properties:
                  category: { $ref: '#/components/schemas/Category' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [categories]
      summary: Eliminar categoría (RN-09)
      description: |
        Si tiene movimientos, exige `reassignTo` (otra categoría propia del mismo tipo) y los
        mueve en la misma transacción antes de eliminarla.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - { name: reassignTo, in: query, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Eliminada }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 'La categoría tiene movimientos y no se indicó `reassignTo`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: La categoría de destino es de otro tipo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /movements:
    get:
      tags: [movements]
      summary: Historial paginado y filtrable (RF-07, RF-11, RF-12, RF-13)
      description: |
        `from` y `to` incluyen ambos días. `q` busca en la descripción sin distinguir
        mayúsculas. El orden es estable entre páginas aunque varios movimientos compartan fecha.
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - {
            name: pageSize,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 50, default: 10 },
          }
        - { name: type, in: query, schema: { $ref: '#/components/schemas/MovementType' } }
        - { name: categoryId, in: query, schema: { type: string, format: uuid } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: q, in: query, schema: { type: string, maxLength: 60 } }
        - { name: sortBy, in: query, schema: { type: string, enum: [date, amount], default: date } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MovementPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Error' }
    post:
      tags: [movements]
      summary: Registrar ingreso o gasto (RF-05, RF-06)
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MovementInput' }
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema:
                type: object
                properties:
                  movement: { $ref: '#/components/schemas/Movement' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '422':
          description: La categoría no corresponde al tipo del movimiento
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /movements/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [movements]
      summary: Consultar un movimiento
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  movement: { $ref: '#/components/schemas/Movement' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [movements]
      summary: Editar movimiento (RF-08)
      description: Edición parcial. Se valida la combinación final de tipo y categoría.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/MovementInput'
              required: []
              minProperties: 1
      responses:
        '200':
          description: Actualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  movement: { $ref: '#/components/schemas/Movement' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: La categoría no corresponde al tipo del movimiento
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [movements]
      summary: Eliminar movimiento (RF-09)
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204': { description: Eliminado }
        '404': { $ref: '#/components/responses/NotFound' }

  /summary/month:
    get:
      tags: [summary]
      summary: Ingresos, gastos y balance del mes (RF-14, RF-15, RF-17)
      parameters:
        - $ref: '#/components/parameters/Year'
        - $ref: '#/components/parameters/Month'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MonthSummary' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /summary/categories:
    get:
      tags: [summary]
      summary: Totales del mes agrupados por categoría
      description: De mayor a menor, con el porcentaje de cada categoría sobre el total del tipo.
      parameters:
        - $ref: '#/components/parameters/Year'
        - $ref: '#/components/parameters/Month'
        - {
            name: type,
            in: query,
            schema: { $ref: '#/components/schemas/MovementType', default: EXPENSE },
          }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  type: { $ref: '#/components/schemas/MovementType' }
                  total: { $ref: '#/components/schemas/Amount' }
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        categoryId: { type: string, format: uuid }
                        name: { type: string }
                        total: { $ref: '#/components/schemas/Amount' }
                        percentage: { type: number, example: 33.3 }
        '400': { $ref: '#/components/responses/ValidationError' }
  /summary/evolution:
    get:
      tags: [summary]
      summary: Ingresos, gastos y balance de los 6 meses que terminan en el indicado (RF-16)
      description: Siempre devuelve 6 meses en orden cronológico; los meses sin movimientos van en cero.
      parameters:
        - $ref: '#/components/parameters/Year'
        - $ref: '#/components/parameters/Month'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  months:
                    type: array
                    items: { $ref: '#/components/schemas/MonthSummary' }
        '400': { $ref: '#/components/responses/ValidationError' }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: simplify_at
      description: Token de acceso (JWT de 15 minutos) en cookie httpOnly.
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Year:
      name: year
      in: query
      required: true
      schema: { type: integer, minimum: 2000, maximum: 2100 }
    Month:
      name: month
      in: query
      required: true
      schema: { type: integer, minimum: 1, maximum: 12 }
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Valor de la cookie `simplify_csrf`
      schema: { type: string }

  responses:
    CsrfError:
      description: Falta el token CSRF o no coincide con la cookie
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Error:
      description: Error con código
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Datos inválidos; `fields` trae los mensajes por campo
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: No existe o pertenece a otro usuario
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Conflicto con el estado actual
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    MovementType:
      type: string
      enum: [INCOME, EXPENSE]
    Amount:
      type: string
      pattern: '^\d{1,10}(\.\d{1,2})?$'
      example: '85.50'
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - VALIDATION_ERROR
                - PAYLOAD_TOO_LARGE
                - UNAUTHENTICATED
                - INVALID_CREDENTIALS
                - EMAIL_ALREADY_REGISTERED
                - TOO_MANY_ATTEMPTS
                - CSRF_TOKEN_INVALID
                - FORBIDDEN
                - NOT_FOUND
                - CATEGORY_TYPE_MISMATCH
                - CATEGORY_IN_USE
                - CATEGORY_ALREADY_EXISTS
                - SERVICE_UNAVAILABLE
                - INTERNAL_ERROR
            message: { type: string }
            requestId: { type: string }
            fields:
              type: object
              additionalProperties:
                type: array
                items: { type: string }
    RegisterInput:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 2, maxLength: 60 }
        email: { type: string, format: email }
        password:
          type: string
          minLength: 8
          maxLength: 128
          description: Debe incluir minúscula, mayúscula, número y carácter especial.
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    UpdateProfileInput:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 2, maxLength: 60 }
        currency: { type: string, enum: [USD, PEN, EUR, MXN, COP] }
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        currency: { type: string, enum: [USD, PEN, EUR, MXN, COP] }
    CategoryInput:
      type: object
      required: [name, type]
      properties:
        name: { type: string, minLength: 2, maxLength: 40 }
        type: { $ref: '#/components/schemas/MovementType' }
    Category:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { $ref: '#/components/schemas/MovementType' }
        isDefault: { type: boolean }
        movementCount: { type: integer }
    MovementInput:
      type: object
      required: [type, description, amount, categoryId, date]
      properties:
        type: { $ref: '#/components/schemas/MovementType' }
        description: { type: string, minLength: 2, maxLength: 120 }
        amount: { $ref: '#/components/schemas/Amount' }
        categoryId: { type: string, format: uuid }
        date: { type: string, format: date }
        notes: { type: string, maxLength: 500 }
    Movement:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/MovementType' }
        description: { type: string }
        amount: { $ref: '#/components/schemas/Amount' }
        date: { type: string, format: date }
        notes: { type: [string, 'null'] }
        category:
          type: object
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            type: { $ref: '#/components/schemas/MovementType' }
    MonthSummary:
      type: object
      properties:
        year: { type: integer }
        month: { type: integer }
        income: { $ref: '#/components/schemas/Amount' }
        expense: { $ref: '#/components/schemas/Amount' }
        balance:
          {
            type: string,
            example: '-150.50',
            description: 'Ingresos − gastos; puede ser negativo.',
          }
    MovementPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Movement' }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }
